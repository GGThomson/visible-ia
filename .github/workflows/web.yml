name: Web (Cloudflare Pages)

# Publishes web/ as a static site. main -> production (<project>.pages.dev);
# pull requests -> a preview URL per branch. No build step: files are served as they are.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: visible-ia

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Forks and Dependabot have no access to secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # First run only: the project does not exist yet. Fails harmlessly afterwards.
      - name: Create Pages project if missing
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=${{ env.PROJECT }} --branch=${{ github.head_ref || github.ref_name }}

      - name: Show URL
        run: echo "Publicado en ${{ steps.deploy.outputs.deployment-url }}"
