# Brand of the reports (Eminia, ADR-005). C10 (white label for agencies) replaces these values
# per agency.
nombre = "Eminia"
lema = "Que la IA te nombre a ti"
color_primario = "#0F1B2D"  # Tinta noche: titles and text
color_acento = "#2447C8"  # Cobalto: only "your clinic" (and buttons on the web)
color_suave = "#F4F6F9"  # Niebla: soft backgrounds
# Optional: absolute URL or data: URI of a logo. Empty = the name is shown as text.
# Eminia: web/marca/logo.svg embedded, so the PDF needs no internet (a test keeps them in sync).
logo_url = "data:image/svg+xml;base64,"
# Real contact of the Director (email or WhatsApp). Empty = not shown.
contacto = "WhatsApp +51 920 857 428"
# Who signs the first WhatsApp message of a batch of diagnostics (C-010).
firma = "Gianpol, de Eminia"
web = "https://visible-ia.pages.dev"
