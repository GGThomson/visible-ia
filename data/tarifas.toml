# Prices of the paid APIs, used to estimate the cost of each call and of each run.
# Review them at every phase close (docs/04-arquitectura/arquitectura.md, costs section).
# Search content tokens are billed as input tokens at the model's rate.

[openai.models."gpt-5-mini"]
input_per_mtok = 0.25
cached_input_per_mtok = 0.025
output_per_mtok = 2.00
checked_on = 2026-09-26
source = "https://developers.openai.com/api/docs/pricing"

[openai.models."gpt-5-nano"]
input_per_mtok = 0.05
cached_input_per_mtok = 0.005
output_per_mtok = 0.40
checked_on = 2026-09-26
source = "https://developers.openai.com/api/docs/pricing"

[openai.web_search]
per_call = 0.01
checked_on = 2026-09-26
source = "https://developers.openai.com/api/docs/pricing"

# Conservative profile of one ChatGPT call, used to estimate a run before launching it.
# The verification call of 2026-09-26 used 2 searches, 13,290 input and 2,339 output tokens.
[openai.estimate]
model = "gpt-5-mini"
searches_per_call = 2
input_tokens_per_call = 15000
output_tokens_per_call = 3000
