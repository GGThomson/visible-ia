[project]
name = "visible-ia"
version = "0.1.0"
description = "Measure whether AI assistants recommend local clinics in Lima."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "openai>=1.99",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "jinja2>=3.1",
    "playwright>=1.47",
]

[project.scripts]
visible-ia = "visible_ia.cli:app"

[dependency-groups]
dev = [
    "pypdf>=5.0",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visible_ia"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Supabase dev database (skipped without SUPABASE_DB_URL)",
    "live: calls a paid or rate-limited external API (run manually)",
]
addopts = "-m 'not integration and not live'"

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters through default-value calls.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
